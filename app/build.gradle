plugins {
    id 'com.android.application'
}

// 发布签名的密码不进仓库：放在 keystore.properties 里（已 gitignore）。
// 文件不存在时照常构建，只是 release 会退回未签名——CI 或换机器时不会卡住。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.example.jizhang'
    compileSdk 34

    defaultConfig {
        // 安装身份。com.example 是官方保留的示例前缀，Play 直接拒收，也可能跟别人
        // 同样偷懒的包名撞车（撞了就互相覆盖）。io.github.<账号> 是 GitHub Pages
        // 的域名，是实际控制的域名，不必另外买。
        //
        // 注意这跟下面的 namespace（Java 包名，仍是 com.example.jizhang）是两回事：
        // 只有 applicationId 决定系统眼里"这是哪个应用"，所以源码一个字都不用改。
        applicationId "io.github.ericlin09.jizhang"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // AGP 8 起 BuildConfig 默认不生成。需要它是因为调试入口靠 BuildConfig.DEBUG
    // 这个编译期常量来守卫——常量才能让 R8 在 release 里把整个分支删干净。
    buildFeatures {
        buildConfig true
    }

    // 双币原版（global）与纯国内版（cn）。差异集中在各自的 source set 里：
    // Flavor.java 的常量 + assets/merchant_rules.tsv 的规则表，共享代码只在
    // 少数几处读 Flavor 的编译期常量——是常量所以死分支会被优化掉，也不存在
    // 运行时状态组合，两个 APK 各自行为固定。
    flavorDimensions += "market"
    productFlavors {
        global {
            dimension "market"
        }
        cn {
            dimension "market"
            applicationIdSuffix ".cn"
        }
    }

    // APK 文件名。默认产出 app-cn-release.apk，分享给别人时看不出是什么，
    // 每次都要手动改名。桌面显示名跟着 flavor 走，这里也照搬同一套叫法。
    // （文件名只影响传输过程，装上后显示的是 strings.xml 里的 app_name。）
    def apkLabel = [global: '记账本', cn: '记账簿']
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def label = apkLabel[variant.flavorName] ?: variant.flavorName
            def suffix = variant.buildType.name == 'release' ? '' : "-${variant.buildType.name}"
            outputFileName = "${label}-${variant.versionName}${suffix}.apk"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 调试包用独立的安装身份。没有这个后缀时 debug 和 release 的 applicationId
            // 相同、签名不同，装 debug 会因签名冲突失败，唯一的出路是先卸载 release
            // ——连带清空账本。加个后缀两者就能并存，各自独立的数据库。
            applicationIdSuffix ".debug"
        }
        release {
            // R8 裁剪 + 混淆。这个应用没有要保护的逻辑，开它是为了体积：依赖里
            // appcompat/material/recyclerview 绝大部分用不到。
            // 代码里没有任何反射（Class.forName / newInstance 全无），XML 引用的
            // PieChartView 由默认规则的 View 构造器保留，所以风险很低。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 被测的是纯函数（金额解析、关键词匹配），不碰 Android API，所以跑本地 JVM
    // 测试而不是 instrumented 测试——不需要设备，秒级反馈。
    // MerchantRules 的方法签名里出现 Context，但测试路径不调用它的任何方法；
    // 打开 returnDefaultValues 只是为了万一碰到桩方法时返回默认值而不是抛异常。
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}
